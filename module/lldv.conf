# Fire TV Cube 3 LLDV module configuration (sourced by lldv_watch.sh as shell).
# Local overrides can be placed in /data/adb/lldv.conf and survive module updates.

# Base Dolby Vision VSVDB to advertise, lowercase hex, header byte included (0xE0 + length-1 for a 12-byte block).
# Default = V2, low-latency only, YCbCr 4:2:2 12-bit; Target Max PQ code 9 (CoreELEC's decoder labels that ~385 cd/m2).
VSVDB=eb0146d0004903485798a953

# Peak luminance to advertise, in cd/m2 (whole number). The nearest selectable value is used and replaces the
# Target Max PQ field of the base block above; 0 or empty = leave the base block exactly as it is.
# Selectable values: 94 110 129 150 175 204 237 276 320 372 431 499 578 670 775 897 1037 1200 1387 1605 1856
#                    2147 2485 2876 3330 3857 4470 5183 6014 6982 8113 9434   (32 steps, see lldv_lum.sh)
# e.g. MAXLUM=385 -> 372 (code 9), MAXLUM=1000 -> 1037, MAXLUM=4000 -> 3857.
MAXLUM=385

# Colour primaries to advertise. One of:
#   BT709           R 0.6400,0.3300  G 0.3000,0.6000  B 0.1500,0.0600
#   BT2020          R 0.7080,0.2920  G 0.1700,0.7970  B 0.1310,0.0460
#   DCI-P3          R 0.6800,0.3200  G 0.2650,0.6900  B 0.1500,0.0600
#   LS12000         R 0.6670,0.3310  G 0.3140,0.6720  B 0.1480,0.0420   ("LS12000 Native")
# Empty = keep the primaries of the base block above exactly as they are (the default).
# Values are stored as /256 steps, rounded down to the representable step (see lldv_gamut.sh).
PRIMARIES=

# Send a CTA-861.3 HDR10 (SMPTE ST 2084 PQ) Dynamic Range & Mastering (DRM) InfoFrame in hardware InfoFrame
# Bank 6 whenever the Cube outputs Low-Latency Dolby Vision (hdmi_hdr_status = DolbyVision-Lowlatency).
# 0 = off (default; use when your display switches via the Dolby VSIF or has a manual HDR EOTF override).
# 1 = on (forces HDR10-only displays to switch into their HDR / PQ EOTF mode automatically during LLDV).
HDR_INFOFRAME=0

# Seconds between checks of the display's reported capabilities.
POLL=2

# Seconds the "no DV" condition (and the EDID) must stay unchanged before injecting, to let a hotplug finish.
SETTLE=3

# Seconds to wait after every injection attempt before checking again (prevents tight loops).
HOLDOFF=15

# Optional browser UI on the local network. Disabled by default. It is started by service.sh at boot.
# To enable it, set WEB=1 in /data/adb/lldv.conf, then reboot (or run lldv_web.sh as root).
# The page is at http://<cube-address>:18765/ and has NO authentication and no encryption: anyone on your
# network who can open the page can change primaries and maxLum. Enable it only on a network you trust
# and never expose the port to the internet. The CGI only accepts fixed primaries/maxLum values and
# changes settings through the existing lldv command.
WEB=0
WEB_PORT=18765
